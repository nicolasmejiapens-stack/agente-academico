name: Gestor academico

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "probar = revisar conexiones, scan = escanear Drive"
        type: choice
        options: [probar, scan]
        default: probar

concurrency:
  group: gestor
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar OCR (Tesseract en español)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng poppler-utils
      - run: pip install -r requirements.txt
      - run: python ejecutar.py ${{ inputs.modo || 'scan' }}
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
