name: Recordatorios y botones

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 1 * * *"
    - cron: "*/10 11-23,0-4 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "manana, noche o botones"
        type: choice
        options: [manana, noche, botones]
        default: manana

concurrency:
  group: tareas-${{ github.event.schedule || inputs.modo }}
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ejecutar.py ${{ inputs.modo || (github.event.schedule == '0 12 * * *' && 'manana') || (github.event.schedule == '0 1 * * *' && 'noche') || 'botones' }}
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
